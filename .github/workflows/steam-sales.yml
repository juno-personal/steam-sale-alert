name: Steam Store Sales Scraper

on:
  workflow_dispatch:
    inputs:
      force_notify:
        description: "send_to_gas 실패로 알림을 놓쳤을 때 전체 대상으로 강제 발송"
        type: boolean
        default: false

permissions:
  contents: write # history.json 커밋 및 푸시
  actions: write  # Pages 배포 워크플로를 명시적으로 트리거

# 두 실행이 겹치면 history.json 충돌로 서로의 기록을 덮어쓴다.
concurrency:
  group: steam-sales
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 전체 스캔은 579페이지 + 1.5초 간격으로 최소 15분, 429 재시도 여유 포함 30분 이상
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gas/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix gas

      - name: Scrape Steam Store sales
        run: >-
          node gas/scraper/scrape.js --out games.json
          ${{ inputs.force_notify && '--force-notify' || '' }}

      # history.json을 먼저 커밋한다.
      # 이 스텝이 뒤에 있으면 알림 전송 실패 시 기록이 유실되어 다음 실행에서
      # 이미 보낸 게임을 전부 신규로 다시 발송한다.
      - name: Commit scrape history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gas/history.json
          git diff-index --quiet HEAD || git commit -m "chore: update scrape history [skip ci]"
          git push origin HEAD:main

      - name: Send results to Google Apps Script
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: node gas/scraper/send_to_gas.js --games games.json

      # 수집한 games.json 을 docs/ 에 반영해 GitHub Pages 가 자동 배포되게 한다.
      # 커밋 메시지에 [skip ci] 를 넣지 않는다. 넣으면 pages.yml 이 건너뛰어진다.
      - name: Push games.json to docs folder (same repo)
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          cp games.json docs/games.json

          git add docs/games.json
          git diff --cached --quiet || git commit -m "chore: update games data"
          git push origin HEAD:main

      # GITHUB_TOKEN 으로 만든 push 는 다른 워크플로를 자동으로 깨우지 않는다.
      # (무한 재귀 방지) 그래서 Pages 배포를 명시적으로 dispatch 한다.
      - name: Trigger Pages deploy
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Upload scrape output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: games-json-on-failure
          path: games.json
          if-no-files-found: ignore
