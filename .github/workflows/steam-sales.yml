name: Steam Store Sales Scraper

on:
  workflow_dispatch:
    inputs:
      force_notify:
        description: "send_to_gas 실패로 알림을 놓쳤을 때 전체 대상으로 강제 발송"
        type: boolean
        default: false

permissions:
  contents: write # history.json 커밋 및 푸시

# 두 실행이 겹치면 history.json 충돌로 서로의 기록을 덮어쓴다.
concurrency:
  group: steam-sales
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 전체 스캔은 579페이지 + 1.5초 간격으로 최소 15분, 429 재시도 여유 포함 30분 이상
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gas/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix gas

      - name: Scrape Steam Store sales
        run: >-
          node gas/scraper/scrape.js --out games.json
          ${{ inputs.force_notify && '--force-notify' || '' }}

      # history.json을 먼저 커밋한다.
      # 이 스텝이 뒤에 있으면 알림 전송 실패 시 기록이 유실되어 다음 실행에서
      # 이미 보낸 게임을 전부 신규로 다시 발송한다.
      - name: Commit scrape history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gas/history.json
          git diff-index --quiet HEAD || git commit -m "chore: update scrape history [skip ci]"
          git push

      - name: Send results to Google Apps Script
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: node gas/scraper/send_to_gas.js --games games.json

      # 공개 저장소(steam-sale-alert-site)에 앱 데이터만 밀어넣는다.
      # 이 저장소를 푸시하면 공개 저장소의 Pages 워크플로가 자동 배포한다.
      # SITE_REPO 는 Variables 탭에도 Secrets 탭에도 있을 수 있으므로 둘 다 읽는다.
      # (저장소 이름은 공개 정보라 Secret 에 두어도 무방하다)
      - name: Push games.json to site folder (same repo)
        run: |
          cd /tmp
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          cp "$GITHUB_WORKSPACE/site/games.json" site/games.json

          git -C . add site/games.json
          git -C . diff-index --quiet HEAD || git commit -m "chore: update games data [skip ci]"
          git -C . push origin main

      - name: Upload scrape output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: games-json-on-failure
          path: games.json
          if-no-files-found: ignore
