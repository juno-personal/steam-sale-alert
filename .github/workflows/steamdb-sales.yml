name: Steam Store Sales Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Scrape SteamDB sales
        run: node scraper/scrape.js --out games.json --verbose

      - name: Send results to Google Apps Script
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: node scraper/send_to_gas.js --games games.json

      - name: Upload blocked-page screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: steamdb-error-screenshot
          path: steamdb-blocked.png
          if-no-files-found: ignore
